[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "india-market-mcp"
version = "1.0.0"
description = "Comprehensive MCP server for Indian stock market — NSE, BSE, Mutual Funds, F&O, Technicals, Screener"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "India Market MCP Contributors" }]
keywords = ["mcp", "nse", "bse", "indian-stock-market", "mutual-funds", "f&o", "options"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "curl-cffi>=0.9.0",
    "pydantic>=2.0.0",
    "diskcache>=5.6.0",
    "pandas>=2.0.0",
    "yfinance>=0.2.0",
    "mftool>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.4.0"]

[project.scripts]
india-market-mcp = "src.server:main"

[tool.pytest.ini_options]
markers = [
    "integration: tests that use live external market-data endpoints",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
